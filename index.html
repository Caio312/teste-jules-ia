<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
        <button id="btn-nova-tarefa" class="btn-primario">+ Nova Tarefa</button>
    </header>

    <main>
        <section id="resumo-tarefas">
            <h2>Resumo</h2>
            <div id="contadores-tarefas">
                <div class="contador">
                    <h3>Total</h3>
                    <p id="total-tarefas">0</p>
                </div>
                <div class="contador">
                    <h3>Pendentes</h3>
                    <p id="tarefas-pendentes">0</p>
                </div>
                <div class="contador">
                    <h3>Concluídas</h3>
                    <p id="tarefas-concluidas">0</p>
                </div>
            </div>
        </section>

        <section id="lista-container">
            <h2>Minhas Tarefas</h2>
            <div id="ferramentas-lista">
                <input type="text" id="busca-tarefa" placeholder="Buscar tarefa...">
                <div id="filtros">
                    <span>Filtrar por:</span>
                    <button class="filtro-btn ativo" data-filtro="todas">Todas</button>
                    <button class="filtro-btn" data-filtro="pendentes">Pendentes</button>
                    <button class="filtro-btn" data-filtro="concluidas">Concluídas</button>
                </div>
                <div id="ordenacao">
                    <label for="ordenar-por">Ordenar por:</label>
                    <select id="ordenar-por">
                        <option value="data">Data de Vencimento</option>
                        <option value="prioridade">Prioridade</option>
                    </select>
                </div>
            </div>
            <div id="lista-tarefas">
                <!-- As tarefas serão inseridas aqui via JavaScript -->
            </div>
        </section>
    </main>

    <!-- Modal do Formulário de Tarefa -->
    <div id="modal-tarefa" class="modal-overlay">
        <div class="modal-conteudo">
            <h2 id="modal-titulo">Nova Tarefa</h2>
            <button id="fechar-modal-tarefa" class="fechar-modal" title="Fechar">&times;</button>
            <form id="form-tarefa">
                <label for="nome-tarefa">Nome da Tarefa:</label>
                <input type="text" id="nome-tarefa" placeholder="Ex: Estudar JavaScript" required>

                <label for="data-vencimento">Data de Vencimento:</label>
                <input type="date" id="data-vencimento" required>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>

                <button type="submit">Adicionar Tarefa</button>
            </form>
        </div>
    </div>

    <script src="script.js" defer></script>

    <!-- Componente de Notificação/Toast -->
    <div id="notificacao" class="notificacao"></div>

    <!-- Componente de Modal de Confirmação -->
    <div id="modal-confirmacao" class="modal-overlay">
        <div class="modal-conteudo">
            <p id="modal-mensagem"></p>
            <div class="modal-botoes">
                <button id="btn-confirmar">Confirmar</button>
                <button id="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>
</body>
</html>
