<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Controle Financeiro</h1>
    </header>

    <main>
        <section id="resumo">
            <h2>Resumo</h2>
            <div id="saldo-container">
                <span id="saldo-display">R$ 0,00</span>
            </div>
        </section>

        <section id="formulario-container">
            <h2>Adicionar Nova Transação</h2>
            <form id="form-transacao">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" required>

                <label for="valor">Valor:</label>
                <input type="number" id="valor" step="0.01" required>

                <label for="tipo">Tipo:</label>
                <select id="tipo">
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>

                <button type="submit">Adicionar Transação</button>
            </form>
        </section>

        <section id="extrato-container">
            <h2>Extrato de Transações</h2>
            <table id="tabela-extrato">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
