<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Controle Financeiro</h1>
        <button id="btn-nova-transacao" class="btn-primario">+ Nova Transação</button>
    </header>

    <main>
        <section id="resumo">
            <h2>Resumo</h2>
            <div id="saldo-container">
                <span id="saldo-display">R$ 0,00</span>
            </div>
        </section>

        <section id="extrato-container">
            <h2>Extrato de Transações</h2>
            <table id="tabela-extrato">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal do Formulário de Transação -->
    <div id="modal-transacao" class="modal-overlay">
        <div class="modal-conteudo">
            <h2 id="modal-titulo">Nova Transação</h2>
            <button id="fechar-modal-transacao" class="fechar-modal" title="Fechar">&times;</button>
            <form id="form-transacao">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Ex: Salário mensal" required>

                <label for="valor">Valor:</label>
                <input type="number" id="valor" step="0.01" placeholder="Ex: 15,50" required>

                <label for="tipo">Tipo:</label>
                <select id="tipo">
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>

                <label for="categoria">Categoria:</label>
                <select id="categoria" required>
                    <!-- Options populated by JS -->
                </select>

                <button type="submit">Adicionar Transação</button>
            </form>
        </div>
    </div>

    <script src="script.js" defer></script>

    <!-- Componente de Notificação/Toast -->
    <div id="notificacao" class="notificacao"></div>

    <!-- Componente de Modal de Confirmação -->
    <div id="modal-confirmacao" class="modal-overlay">
        <div class="modal-conteudo">
            <p id="modal-mensagem"></p>
            <div class="modal-botoes">
                <button id="btn-confirmar">Confirmar</button>
                <button id="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>
</body>
</html>
